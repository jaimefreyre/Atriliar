<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StagePrompter Pro</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/prompter.css">
  <link rel="stylesheet" href="css/evaluator.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🎸 STAGE PROMPTER <span class="version">PRO</span></h1>
    </header>
    <main id="library-view">
      <div class="actions">
        <button id="btn-import" class="btn-primary">📥 IMPORTAR</button>
        <button id="btn-new" class="btn-secondary">➕ NUEVA</button>
        <input type="file" id="file-input" accept=".json" style="display:none">
      </div>
      <h2> MIS CANCIONES</h2>
      <div id="song-list" class="song-list"></div>
    </main>
  </div>

  <div id="import-modal" class="modal">
    <div class="modal-content">
      <div id="import-modal-body"></div>
      <div id="import-modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <div id="calibration-view" style="display:none"></div>
  <div id="player-view" style="display:none;background:#000;min-height:100vh"></div>

  <div id="stage-container">
    <!-- Header con botones de toggle -->
    <div id="stage-header">
      <div class="header-left">
        <h1 id="stage-song-title">-</h1>
        <div class="stage-meta">
          <span id="stage-artist">-</span>
          <span class="sep">|</span>
          <span id="stage-key">-</span>
          <span class="sep">|</span>
          <span id="stage-bpm">- BPM</span>
        </div>
      </div>
      <div class="header-center">
        <div class="current-chord-box">
          <span class="chord-label">ACORDE</span>
          <span id="current-chord" class="chord-value">-</span>
        </div>
        <div class="scale-box">
          <label>Escala:</label>
          <select id="scale-select"><option value="none">— Ninguna —</option></select>
        </div>
      </div>
      <div class="header-right">
        <button id="btn-toggle-harmony" class="toggle-btn" title="Armonía">🎵</button>
        <button id="btn-toggle-tab" class="toggle-btn" title="Tablatura">🎸</button>
        <button id="btn-exit-stage" class="exit-btn">EXIT</button>
      </div>
    </div>

    <!-- Barra superior fija (progreso + drawers) -->
    <div id="sticky-top-bar">
      <!-- Barra de progreso -->
      <div id="progress-bar-container">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-info">
          <span id="progress-percent">0%</span>
          <span id="progress-position">-</span>
        </div>
      </div>

      <!-- Drawer de Armonía -->
      <div id="drawer-harmony" class="drawer">
        <div class="drawer-header">
          <span> ARMONÍA - Diapasón y Piano</span>
          <button class="drawer-close" onclick="window.stage.toggleHarmony()">✕</button>
        </div>
        <div class="drawer-content">
          <div class="diagrams-row">
            <div class="diagram-col">
              <div id="diagram-fretboard" class="diagram-box"></div>
              <div class="diagram-legend" id="legend-fretboard"></div>
            </div>
            <div class="diagram-col">
              <div id="diagram-piano" class="diagram-box"></div>
              <div class="diagram-legend" id="legend-piano"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Drawer de Tablatura -->
      <div id="drawer-tab" class="drawer">
        <div class="drawer-header">
          <span>🎸 TABLATURA</span>
          <button class="drawer-close" onclick="window.stage.toggleTab()">✕</button>
        </div>
        <div class="drawer-content">
          <div id="diagram-tab" class="tab-box"></div>
        </div>
      </div>
    </div>

    <!-- Contenido de letra -->
    <div id="stage-content"></div>

    <!-- Controles inferiores -->
    <div id="stage-controls">
      <button class="stage-btn" onclick="window.stage.adjustFontSize(-2)">A-</button>
      <button class="stage-btn" onclick="window.stage.adjustFontSize(2)">A+</button>
      <button class="stage-btn" onclick="window.stage.adjustTranspose(-1)">T-</button>
      <button class="stage-btn" onclick="window.stage.adjustTranspose(1)">T+</button>
      <button class="stage-btn" onclick="window.stage.prevChord()">⏮</button>
      <button class="stage-btn" id="btn-autoscroll" onclick="window.stage.toggleAutoScroll()">▶ PLAY</button>
      <button class="stage-btn" onclick="window.stage.nextChord()">⏭</button>
      <button class="stage-btn exit-btn-mobile" onclick="window.stage.exitStageMode()">EXIT</button>
    </div>

    <div id="touch-left" class="touch-zone"></div>
    <div id="touch-right" class="touch-zone"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
