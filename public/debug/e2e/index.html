<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StagePrompter · E2b E2E</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/dialogs.css">
  <style>
    @layer components {
      body { padding: 1rem; }
      .sp-e2e { display: grid; gap: 1rem; max-inline-size: 84rem; margin-inline: auto; }
      .sp-e2e__frame { inline-size: 100%; block-size: 72dvh; min-block-size: 34rem; border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); background: var(--color-page); }
      .sp-e2e__results { display: grid; gap: 0.35rem; padding: 0; list-style: none; font-size: var(--text-sm); }
      .sp-e2e__results li[data-result="pass"] { color: var(--color-confirmed); }
      .sp-e2e__results li[data-result="fail"] { color: var(--color-danger); }
      .sp-e2e__note { color: var(--color-text-secondary); font-size: var(--text-sm); }
    }
  </style>
</head>
<body>
  <main class="sp-e2e">
    <header class="sp-row">
      <h1>Suite E2b · shell y biblioteca</h1>
      <button class="sp-btn sp-btn--primary" type="button" id="run-suite">Ejecutar pruebas</button>
    </header>
    <p class="sp-e2e__note">Usa una instancia de prueba, no activa el micrófono y no sube datos. La prueba de audio adjunta una onda sintética de 440 Hz.</p>
    <ol id="results" class="sp-e2e__results" aria-live="polite"></ol>
    <iframe id="app-under-test" class="sp-e2e__frame" title="Aplicación StagePrompter bajo prueba"></iframe>
  </main>
  <script type="module" src="./runner.js"></script>
</body>
</html>
